apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app-ingress
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /gemini/chat
            pathType: Prefix
            backend:
              service:
                name: backend-service
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service # Fixed: changed from react-service
                port:
                  number: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: spring-gemini
  template:
    metadata:
      labels:
        app: spring-gemini
    spec:
      containers:
        - name: backend
          image: spring-gemini:1.0
          imagePullPolicy: Never
          envFrom:
            - secretRef:
                name: spring-app-secrets
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
spec:
  type: ClusterIP
  selector:
    app: spring-gemini
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: react-gemini
  template:
    metadata:
      labels:
        app: react-gemini
    spec:
      containers:
        - name: frontend
          image: react-gemini:1.0
          imagePullPolicy: Never
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
spec:
  type: NodePort
  selector:
    app: react-gemini
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080

