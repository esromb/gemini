plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.2'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'esrom.gemini.llm'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}
repositories {
	mavenCentral()
}

springBoot {
	mainClass = 'esrom.gemini.llm.gemini.GeminiApplication'
}
ext {
	set('springAiVersion', "2.0.1")
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.ai:spring-ai-starter-model-google-genai'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	implementation(project(":frontend"))
}

dependencyManagement {
	imports {
		mavenBom "org.springframework.ai:spring-ai-bom:${springAiVersion}"
	}
}

// Ensure the frontend builds before the backend archives
tasks.named("processResources") {
	dependsOn(":frontend:assembleFrontend")
}
// Task to bundle frontend assets into Spring Boot's static resources path
tasks.register("copyFrontendAssets", Copy) {
	dependsOn(":frontend:assembleFrontend")
	from(project(":frontend").layout.projectDirectory.dir("dist")) // or "build" depending on Vite/CRA
	into(layout.buildDirectory.dir("resources/main/static"))
}

tasks.named("bootJar") {
	dependsOn("copyFrontendAssets")
}
tasks.named('test') {
	useJUnitPlatform()
}

resolveMainClassName.dependsOn('copyFrontendAssets')
jar.dependsOn('copyFrontendAssets')
compileTestJava.dependsOn('copyFrontendAssets')